name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1
    with:
      version-source: pyproject

  dist:
    name: Build
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/python-uv-ci.yml@v1
    with:
      test-command: ""
      build-dist: true

  # PyPI trusted publishing is bound to the calling workflow file, so the publish job
  # stays here instead of inside the template.
  pypi:
    name: PyPI
    needs: [gate, dist]
    if: needs.gate.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/chuni-scanner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
